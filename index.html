<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pour Cami 💌</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap">
<style>
:root{--bg:#f4e6dc;--ink:#3a1f26;--rose:#b3394f;--gold:#a97f3f;--paper:#fffaf3;--env:#ecd3c4;--env2:#e0bfae;--shade:rgba(90,30,40,.18)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b0d13;--ink:#f3e3dc;--rose:#e0728a;--gold:#d9b46a;--paper:#2a141c;--env:#4a2430;--env2:#3b1c26;--shade:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#1b0d13;--ink:#f3e3dc;--rose:#e0728a;--gold:#d9b46a;--paper:#2a141c;--env:#4a2430;--env2:#3b1c26;--shade:rgba(0,0,0,.5)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(circle at 50% 0,var(--paper) 0,var(--bg) 70%) var(--bg);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-size:1.22rem;line-height:1.75;overflow-x:hidden}
.script{font-family:'Great Vibes','Brush Script MT',cursive;font-weight:400}
#env{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);background:var(--bg);text-align:center;transition:opacity .9s}
#env.gone{opacity:0;pointer-events:none}
.envelope{position:relative;width:min(84vw,340px);aspect-ratio:3/2;background:var(--env);border-radius:6px;box-shadow:0 18px 40px var(--shade)}
.flap{position:absolute;top:0;left:0;width:100%;height:58%;background:var(--env2);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s ease;z-index:2}
.open .flap{transform:rotateX(180deg)}
.to{position:absolute;bottom:14%;left:0;right:0;font-size:2rem;color:var(--rose)}
#seal{position:absolute;z-index:3;top:58%;left:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border:0;border-radius:50%;background:var(--rose);color:#fff;font-size:1.6rem;cursor:pointer;box-shadow:0 4px 12px var(--shade);animation:beat 1.6s infinite;transition:opacity .5s}
.open #seal{opacity:0;animation:none}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.hint{margin-top:26px;font-style:italic;opacity:.75;font-size:1.05rem}
#letter{position:relative;z-index:1;max-width:660px;margin:0 auto;padding:28px 18px 70px;animation:fade 1.4s both}
@keyframes fade{from{opacity:0;transform:translateY(14px)}}
.paper{background:var(--paper);border:1px solid var(--gold);border-radius:4px;padding:34px 24px;box-shadow:0 14px 40px var(--shade)}
@media(min-width:600px){.paper{padding:52px 56px}}
h1{margin:0 0 4px;text-align:center;font-size:clamp(2.1rem,8vw,3rem);line-height:1.15;color:var(--rose)}
.sub{text-align:center;font-style:italic;font-size:1rem;opacity:.8;margin:0 0 6px}
.cnt{text-align:center;color:var(--gold);font-size:1.05rem;margin:0 0 30px}
.cnt b{font-size:1.4rem}
p{margin:0 0 1.15em}
.r{opacity:0;transform:translateY(16px);transition:opacity 1s,transform 1s}
.r.in{opacity:1;transform:none}
em{color:var(--rose)}
.orn{text-align:center;color:var(--gold);letter-spacing:.6em;margin:1.4em 0}
.mk{font-size:.62em;font-weight:600;letter-spacing:.04em;color:var(--rose);text-transform:uppercase}
.tl{list-style:none;margin:1.6em 0;padding:0 0 0 22px;border-left:2px solid var(--gold)}
.tl li{position:relative;margin:0 0 .9em;font-size:1.05rem;line-height:1.4}
.tl li::before{content:"♥";position:absolute;left:-31px;top:0;color:var(--rose);background:var(--paper);font-size:.95rem}
.tl b{display:block;color:var(--gold);font-size:.9rem;letter-spacing:.06em;text-transform:uppercase}
.door{text-align:center;margin:1.2em 0}
#doorbtn{font:inherit;font-size:1.05rem;padding:.6em 1.4em;border:1px solid var(--rose);border-radius:99px;background:transparent;color:var(--rose);cursor:pointer}
#secret{max-height:0;overflow:hidden;opacity:0;transition:max-height 1.6s ease,opacity 1.6s;font-style:italic}
#secret.open{max-height:1400px;opacity:1;margin-top:1.4em}
.sign{text-align:right;margin-top:1.6em}
.sign .script{font-size:2.6rem;color:var(--rose);line-height:1}
.song{text-align:center;font-style:italic;font-size:1rem;opacity:.8;margin:0 0 26px}
.ps{font-size:1rem;opacity:.9;margin-top:2em;border-top:1px dashed var(--gold);padding-top:1em}
.h{position:fixed;bottom:-30px;z-index:0;color:var(--rose);opacity:0;pointer-events:none;animation:up linear forwards}
@keyframes up{10%{opacity:.5}100%{transform:translate(var(--dx),-115vh);opacity:0}}
@media(prefers-reduced-motion:reduce){.r{opacity:1;transform:none;transition:none}#seal{animation:none}.flap{transition:none}}
#gate{margin-top:22px}#gate .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}#gate input{font:inherit;font-size:1.1rem;padding:.55em .9em;border:1px solid var(--gold);border-radius:99px;background:var(--paper);color:var(--ink);text-align:center;width:min(70vw,260px)}#gate button{font:inherit;padding:.55em 1.3em;border:0;border-radius:99px;background:var(--rose);color:#fff;cursor:pointer}#err{color:var(--rose);min-height:1.4em;font-style:italic;margin:8px 0 0}.cdt{font-size:clamp(1.3rem,6vw,1.9rem);color:var(--rose);font-variant-numeric:tabular-nums;margin:10px 0 0}</style>
</head>
<body>
<div id="env">
  <div>
    <div class="envelope" id="envelope"><div class="flap"></div><button id="seal" aria-label="Ouvrir la lettre">♥</button><div class="to script">Pour Cami</div></div>
    <form id="gate" autocomplete="off"><div id="cd" hidden><p class="hint" id="cdh"></p><p class="cdt" id="cdt"></p></div><div id="entry" hidden><p class="hint">Pour ouvrir, entre notre secret 🔐</p><div class="row"><input id="pw" type="password" placeholder="Mot de passe" aria-label="Mot de passe"><button type="submit">Ouvrir</button></div><p id="err"></p></div></form>
  </div>
</div>

<main id="letter" hidden></main>

<script>
function boot(){(function(){
  var $=function(s){return document.querySelector(s)};
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var d=Math.floor((Date.now()-new Date(2022,9,15).getTime())/864e5);
  $('#cnt').textContent=d>0?d.toLocaleString('fr-FR'):'∞';
  function heart(){
    var h=document.createElement('span');
    h.className='h';h.textContent=Math.random()<.5?'♥':'❤';
    h.style.left=Math.random()*100+'vw';
    h.style.fontSize=(12+Math.random()*20)+'px';
    h.style.setProperty('--dx',(Math.random()*80-40)+'px');
    h.style.animationDuration=(9+Math.random()*7)+'s';
    document.body.appendChild(h);
    setTimeout(function(){h.remove()},17000);
  }
  $('#seal').addEventListener('click',function(){
    $('#env').classList.add('open');
    setTimeout(function(){
      $('#env').classList.add('gone');
      $('#letter').hidden=false;
      window.scrollTo(0,0);
      var els=document.querySelectorAll('.r');
      if('IntersectionObserver' in window){
        var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.15});
        els.forEach(function(el){io.observe(el)});
      }else{els.forEach(function(el){el.classList.add('in')})}
      if(!reduce){heart();setInterval(heart,900)}
      setTimeout(function(){$('#env').style.display='none'},1000);
    },1100);
  });
  $('#doorbtn').addEventListener('click',function(){
    $('#secret').classList.add('open');
    this.textContent='🤍 La porte est fermée';
    this.disabled=true;
  });
})();}
</script>

function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function show(id,on){document.getElementById(id).hidden=!on}
function tick(){
  var left=Math.floor((T-Date.now())/1000);
  if(!T||left<=0||location.hash==='#sacre'){show('cd',false);show('entry',true);return}
  show('cd',true);
  var d=Math.floor(left/86400);left-=d*86400;
  var h=Math.floor(left/3600);left-=h*3600;
  var m=Math.floor(left/60);left-=m*60;
  document.getElementById('cdt').textContent=d+' j · '+h+' h · '+m+' min · '+left+' s';
  setTimeout(tick,1000);
